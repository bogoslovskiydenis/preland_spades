<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Spades Partners</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <canvas id="sparks"></canvas>
  <div class="scene">
    <div class="cards-wrap">

      <div class="card card--1">
        <img class="card__bg" src="assets/bg_card1.png" alt="Spades Partners" />
        <img class="card__logo card__logo--tl" src="assets/logo_card1.png" alt="" />
        <img class="card__logo card__logo--br" src="assets/logo_card1.png" alt="" />
        <div class="card__footer">
          <a href="#" class="btn btn--gold">Website &rarr;</a>
        </div>
      </div>

      <div class="card card--2">
        <img class="card__bg" src="assets/bg_card2.png" alt="Spin Empire" />
        <img class="card__logo card__logo--tl" src="assets/logo_card2.png" alt="" />
        <img class="card__logo card__logo--br" src="assets/logo_card2.png" alt="" />
        <div class="card__footer">
          <a href="#" class="btn btn--red">Website &rarr;</a>
        </div>
      </div>

      <div class="card card--3">
        <img class="card__bg" src="assets/bg_card3.png" alt="Telegram" />
        <img class="card__logo card__logo--tl" src="assets/logo_card3.png" alt="" />
        <img class="card__logo card__logo--br" src="assets/logo_card3.png" alt="" />
        <div class="card__footer">
          <a href="#" class="btn btn--blue">Telegram &rarr;</a>
        </div>
      </div>

    </div>
  </div>
  <script src="js/sparks.js"></script>
</body>
</html>
